
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bright Future Academy | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Portal</h1>
        <p>Bright Future Academy</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="registration.html">Register / Login</a>
        </nav>
    </header>

    <main>

        <section id="registrationSection">
            <h2>New Student Registration</h2>

            <form id="registrationForm">

                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName"
                       name="studentName" placeholder="Enter your full name"
                       required>

                <label for="studentEmail">Email Address:</label>
                <input type="email" id="studentEmail"
                       name="studentEmail" placeholder="Enter your email"
                       required>

                <label for="studentAge">Age:</label>
                <input type="number" id="studentAge"
                       name="studentAge" placeholder="Enter your age"
                       min="10" required>

                <label for="studentGender">Gender:</label>
                <select id="studentGender" name="studentGender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>

                <label for="studentCourse">Select Course:</label>
                <select id="studentCourse" name="studentCourse" required>
                    <option value="">Choose a course</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="English Language">English Language</option>
                    <option value="Biology">Biology</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Physics">Physics</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Further Mathematics">Further Mathematics</option>
                </select>

                <label for="newUsername">Create Username:</label>
                <input type="text" id="newUsername"
                       name="newUsername" placeholder="Choose a username"
                       required>

                <label for="newPassword">Create Password:</label>
                <input type="password" id="newPassword"
                       name="newPassword" placeholder="Choose a password"
                       required>

                <button type="submit" id="registerButton">
                    Register Student
                </button>

                <p id="registrationMessage" aria-live="polite"></p>

            </form>
        </section>

        <section id="loginSection">
            <h2>Student Login</h2>

            <form id="loginForm">

                <label for="loginUsername">Username:</label>
                <input type="text" id="loginUsername"
                       name="loginUsername" placeholder="Enter your username"
                       required>

                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword"
                       name="loginPassword" placeholder="Enter your password"
                       required>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <p id="loginMessage" aria-live="polite"></p>

            </form>
        </section>

        <p>
            <a href="index.html">Return to Home Page</a>
        </p>

    </main>

    <footer>
        <p>&copy; 2026 Bright Future Academy. All rights reserved.</p>
    </footer>
<script src="registration.js"></script>
</body>
</html>
